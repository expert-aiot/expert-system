<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>專家系統｜水耕蔬菜 - 概念 UI v1</title>
  <style>
    :root {
      --bg: #06111f;
      --panel: #0b2133;
      --panel2: #071827;
      --line: #1e89c5;
      --line-soft: #235f86;
      --text: #edfaff;
      --muted: #b8d5e2;
      --cyan: #55dcff;
      --green: #35e67d;
      --yellow: #ffd166;
      --red: #ff5b7a;
      --leaf: #87d957;
      --water: #45c7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(85, 220, 255, .14), transparent 28%),
        linear-gradient(180deg, #06111f 0%, #071827 100%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
    }
    body.splitConcept #deviceBtn { display: none; }
    body.mobilePreview { background: linear-gradient(90deg, #040b13, #071827, #040b13); }
    button { font: inherit; color: inherit; }
    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 16px 18px 24px; }
    body.mobilePreview .shell {
      width: min(390px, calc(100% - 48px));
      min-height: calc(100vh - 24px);
      margin: 12px auto;
      padding: 12px 12px 86px;
      border: 1px solid rgba(85, 220, 255, .38);
      border-radius: 24px;
      background: #07111f;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
      overflow: hidden;
    }
    .top {
      display: grid;
      grid-template-columns: 230px minmax(420px, 1fr) 360px;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand { font-size: 27px; font-weight: 900; }
    .title {
      justify-self: center;
      width: min(760px, 100%);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px 18px;
      color: #f4fdff;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      background: rgba(16, 43, 60, .6);
    }
    .meta { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .pill, .seg button, .toolButton, .tab, .mobileTab {
      min-height: 34px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      background: #102c43;
      font-weight: 800;
      white-space: nowrap;
    }
    .toolButton, .seg button, .tab, .mobileTab { cursor: pointer; }
    .toolButton.active, .seg button.active, .tab.active, .mobileTab.active {
      color: #fff;
      border-color: var(--green);
      background: #103d2a;
    }
    .seg button.placeholder {
      opacity: .72;
      border-style: dashed;
      cursor: default;
    }
    .seg .settingsShortcut {
      color: #fff;
      border-color: var(--green);
      background: #103d2a;
      box-shadow: 0 0 0 1px rgba(53, 230, 125, .18), 0 0 20px rgba(53, 230, 125, .14);
    }
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      margin-bottom: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: rgba(11, 33, 51, .82);
      overflow: visible;
    }
    .viewSeg {
      flex: 0 0 auto;
      margin-bottom: 0;
      padding: 4px;
      overflow: visible;
      white-space: nowrap;
    }
    .viewSeg button {
      min-height: 34px;
      padding: 6px 13px;
    }
    .ratioToolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 8px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: rgba(11, 33, 51, .62);
    }
    .ratioToolbar .muted { font-weight: 800; }
    .windowSwitch { display: flex; gap: 6px; overflow-x: auto; }
    .windowSwitch button { min-height: 32px; border: 1px solid var(--line-soft); border-radius: 999px; padding: 5px 11px; color: var(--muted); background: #102c43; font-weight: 800; white-space: nowrap; cursor: pointer; }
    .windowSwitch button.active { color: #fff; border-color: var(--green); background: #103d2a; }
    .grid { display: grid; gap: 14px; }
    .overview { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .main { grid-template-columns: 1fr; align-items: stretch; }
    .bottomGrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; margin-top: 14px; }
    .panel, .card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(11, 33, 51, .95);
      overflow: hidden;
    }
    .card { padding: 14px; display: grid; gap: 12px; }
    .panelHead {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line-soft);
    }
    .panelBody { padding: 14px 15px; }
    h1, h2, h3, p { margin: 0; }
    h2, h3 { color: #8de6ff; letter-spacing: 0; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .indexCard .head, .paramCard .head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .indexName { display: grid; gap: 4px; min-width: 0; }
    .indexName strong { color: #8de6ff; font-size: 21px; }
    .light {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      max-width: 100%;
      flex-shrink: 0;
      min-height: 30px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 900;
    }
    .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; background: var(--green); }
    .green { border-color: var(--green); background: rgba(16, 61, 42, .82); }
    .yellow { border-color: var(--yellow); background: rgba(66, 56, 27, .88); }
    .red { border-color: var(--red); background: rgba(61, 20, 34, .88); }
    .yellow .dot { background: var(--yellow); }
    .red .dot { background: var(--red); }
    .scoreRow { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 14px; align-items: center; }
    .ring {
      --pct: 88%;
      --ring: var(--green);
      width: 94px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: conic-gradient(var(--ring) var(--pct), rgba(25, 77, 105, .95) 0);
    }
    .ring::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid rgba(141, 230, 255, .48);
    }
    .ring b { position: relative; z-index: 1; font-size: 30px; line-height: 1; }
    .ring.yellowRing { --ring: var(--yellow); }
    .ring.redRing { --ring: var(--red); }
    .ratio { display: grid; gap: 7px; }
    .ratioWrap {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .ratioPie {
      width: 54px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--line-soft);
      background: conic-gradient(
        var(--green) 0deg var(--green-deg),
        var(--yellow) var(--green-deg) var(--yellow-deg),
        var(--red) var(--yellow-deg) 360deg
      );
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 10px 20px rgba(0,0,0,.18);
    }
    .ratioText {
      min-width: 0;
      display: grid;
      gap: 4px;
    }
    .paramGrid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .liveReadings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto repeat(3, minmax(0, 1fr)); gap: 8px; align-content: stretch; height: 100%; }
    .paramCard {
      padding: 9px;
      display: grid;
      gap: 6px;
      align-content: center;
      background: var(--panel2);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
    }
    .paramValue { font-size: 21px; font-weight: 900; color: #fff; line-height: 1; }
    .leafTempCard { grid-column: 1 / -1; align-content: start; gap: 8px; min-height: 132px; }
    .leafTempTop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .leafMeta { display: grid; gap: 3px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .measureRows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .measureRow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 7px; align-items: center; min-width: 0; border: 1px solid rgba(85, 220, 255, .25); border-radius: 8px; padding: 6px; background: rgba(4, 17, 30, .42); font-size: 12px; }
    .measureRow strong { color: #fff; font-size: 14px; }
    .miniDot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px rgba(53,230,125,.34); }
    .miniDot.yellow { background: var(--yellow); box-shadow: 0 0 14px rgba(255,209,102,.34); }
    .miniDot.red { background: var(--red); box-shadow: 0 0 14px rgba(255,91,122,.34); }
    .thermalThumb { width: 58px; height: 38px; border-radius: 8px; border: 1px solid rgba(255, 209, 102, .48); background: radial-gradient(circle at 62% 42%, rgba(255,91,122,.95), transparent 24%), radial-gradient(circle at 38% 58%, rgba(255,209,102,.9), transparent 28%), linear-gradient(135deg, #11395d, #26765c 48%, #061827); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 12px 22px rgba(0,0,0,.2); }
    .leafTempRatio { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: center; }
    .leafTempRatio .ratioPie { width: 38px; }
    .chartGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart {
      width: 100%;
      height: 230px;
      display: block;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel2);
    }
    .chart.hidden { display: none; }
    .leafTempTrend { min-height: 230px; border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px; background: var(--panel2); display: grid; gap: 10px; align-content: start; }
    .leafTempTrend.hidden { display: none; }
    .recordGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .dotHistory { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .dayDot { display: grid; place-items: center; min-height: 34px; border: 1px solid rgba(85,220,255,.25); border-radius: 8px; background: rgba(4,17,30,.38); color: #dff8ff; font-size: 12px; font-weight: 800; }
    .cultivationLayout { display: grid; grid-template-columns: 320px 400px 420px; gap: 12px; align-items: stretch; justify-content: start; }
    .imageColumn { min-width: 0; display: flex; justify-content: flex-start; }
    .lgiPanel { display: grid; gap: 10px; align-content: start; background: rgba(7, 24, 39, .86); }
    .lgiPanel .visionSummary { grid-template-columns: 1fr; margin-top: 0; }
    .scene {
      width: min(100%, 400px);
      height: auto;
      min-height: 0;
      aspect-ratio: 4 / 5;
      margin: 0;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #04111e;
      position: relative;
      overflow: hidden;
    }
    .scanVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .96;
      filter: saturate(1.08) contrast(1.04);
    }
    .scanVideoFill {
      display: none;
      object-fit: contain;
      opacity: .38;
      filter: blur(24px) saturate(1.16) contrast(1.05);
      transform: scale(1.08);
    }
    .scanVideoMain {
      object-fit: contain;
      object-position: center;
      z-index: 1;
      filter: saturate(1.08) contrast(1.04)
        drop-shadow(0 0 24px rgba(69, 199, 244, .16));
    }
    .scene::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(4, 17, 30, .28) 76%, rgba(4, 17, 30, .58) 100%),
        linear-gradient(90deg, rgba(4, 17, 30, .28), transparent 24%, transparent 76%, rgba(4, 17, 30, .28));
    }
    .node {
      position: absolute;
      z-index: 2;
      display: grid;
      gap: 3px;
      min-width: 106px;
      border: 1px solid rgba(85, 220, 255, .52);
      border-radius: 8px;
      padding: 7px 8px;
      color: var(--muted);
      background: rgba(11, 33, 51, .76);
      backdrop-filter: blur(7px);
      font-size: 12px;
    }
    .node strong { color: #fff; font-size: 15px; }
    .n1 { right: 132px; top: 96px; }
    .n2 { right: 18px; bottom: 92px; }
    .n3 { left: 18px; bottom: 92px; }
    .n4 { left: 18px; bottom: 24px; }
    .n5 { left: 50%; bottom: 24px; transform: translateX(-50%); }
    .sideList { display: grid; gap: 10px; }
    .visionSummary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .visionSummary span { border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; color: #dff8ff; background: rgba(11, 33, 51, .78); font-weight: 800; }
    .growthFusionNote {
      margin-top: 10px;
      border: 1px solid rgba(53, 230, 125, .45);
      border-radius: 8px;
      padding: 10px 12px;
      color: #dff8ff;
      background: rgba(8, 63, 44, .44);
      font-weight: 800;
    }
    .trendToolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .trendSelectorGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 12px;
    }
    .trendSelectorGrid .trendToolbar { margin-bottom: 0; }
    .trendToolbar label { color: var(--muted); font-weight: 800; }
    .trendToolbar select {
      min-height: 36px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 6px 14px;
      color: var(--text);
      background: #102c43;
      font: inherit;
      font-weight: 800;
    }
    .item {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel2);
      padding: 10px;
    }
    .item strong { color: #fff; }
    .itemHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tier { border: 1px solid var(--line-soft); border-radius: 999px; padding: 4px 8px; color: #fff; font-size: 12px; font-weight: 900; white-space: nowrap; }
    .tier.observe { background: rgba(85, 220, 255, .16); }
    .tier.today { border-color: var(--yellow); background: rgba(255, 209, 102, .18); }
    .tier.now { border-color: var(--red); background: rgba(255, 91, 122, .18); }
    .deviceRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; background: var(--panel2); }
    .deviceRow.on { border-color: var(--green); background: #0f3a2b; }
    .ruleGrid { grid-template-columns: 1fr; gap: 8px; }
    .ruleCard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; background: var(--panel2); }
    .ruleCard.warn { border-color: var(--yellow); background: rgba(255, 209, 102, .12); }
    .ruleCard strong { color: #fff; display: block; margin-bottom: 3px; }
    .ruleBadge { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--line-soft); color: #fff; font-size: 12px; font-weight: 900; background: rgba(85, 220, 255, .12); }
    .ruleCard.warn .ruleBadge { border-color: var(--yellow); background: rgba(255, 209, 102, .2); }
    .hidden { display: none !important; }
    .mobileOnlyPanel { display: none; margin-top: 14px; }
    .mobileTabs { display: none; }
    body.mobilePreview [data-mobile-panel] { display: none; }
    body.mobilePreview [data-mobile-panel].mobileActive { display: grid; }
    body.mobilePreview .panel.mobileActive { display: block; }
    body.mobilePreview .mobileOnlyPanel.mobileActive { display: block; }
    body.mobilePreview .mobileOnlyPanel .liveReadings { height: auto; }
    body.mobilePreview .cultivationLayout > .liveReadings { display: none; }
    body.mobilePreview .mobileLiveAlerts { display: grid; gap: 8px; }
    body.mobilePreview[data-mobile-panel="rules"] .bottomGrid.mobileActive .panel:first-child { display: none; }
    body.mobilePreview .bottomGrid .panelHead { display: grid; grid-template-columns: 1fr; justify-items: start; gap: 8px; }
    body.mobilePreview[data-mobile-panel="rules"] .shell { width: min(430px, calc(100% - 18px)); padding-left: 10px; padding-right: 10px; }
    body.mobilePreview[data-mobile-panel="rules"] .bottomGrid { gap: 0; }
    body.mobilePreview[data-mobile-panel="rules"] .bottomGrid .panel:last-child { width: 100%; }
    body.mobilePreview[data-mobile-panel="rules"] .bottomGrid .panelHead { padding: 12px; }
    body.mobilePreview[data-mobile-panel="rules"] #rulesTitle { font-size: 22px; white-space: nowrap; line-height: 1.2; }
    body.mobilePreview[data-mobile-panel="rules"] #rulesPill { min-height: 30px; padding-top: 4px; padding-bottom: 4px; }
    body.mobilePreview[data-mobile-panel="rules"] .ruleGrid { gap: 10px; padding: 12px; }
    body.mobilePreview[data-mobile-panel="rules"] .ruleCard { grid-template-columns: 1fr; gap: 8px; padding: 12px; }
    body.mobilePreview[data-mobile-panel="rules"] .ruleBadge { width: max-content; min-width: 30px; height: 26px; padding: 0 8px; }
    body.mobilePreview[data-mobile-panel="rules"] .ruleCard strong { font-size: 18px; line-height: 1.25; margin-bottom: 4px; }
    body.mobilePreview[data-mobile-panel="rules"] .ruleCard .muted { font-size: 15px; line-height: 1.55; }
    body.mobilePreview .mobileTabs {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 20;
      width: min(360px, calc(100% - 72px));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px;
      border: 1px solid rgba(85, 220, 255, .36);
      border-radius: 18px;
      background: rgba(7, 17, 31, .96);
      box-shadow: 0 16px 42px rgba(0, 0, 0, .42);
      backdrop-filter: blur(12px);
    }
    .mobileTab { min-height: 46px; border-radius: 12px; font-size: 12px; padding: 4px; }
    body.mobilePreview .top,
    body.mobilePreview .overview,
    body.mobilePreview .main,
    body.mobilePreview .chartGrid,
    body.mobilePreview .trendSelectorGrid,
    body.mobilePreview .ruleGrid { grid-template-columns: 1fr; }
    body.mobilePreview .top { gap: 10px; }
    body.mobilePreview .top > *, body.mobilePreview .panel, body.mobilePreview .card, body.mobilePreview .paramCard { min-width: 0; }
    body.mobilePreview .brand { font-size: 21px; }
    body.mobilePreview .title { font-size: 18px; padding: 9px 12px; }
    body.mobilePreview .meta { justify-content: flex-start; }
    body.mobilePreview .ratioToolbar { align-items: stretch; flex-direction: column; }
    body.mobilePreview .paramGrid, body.mobilePreview .liveReadings { grid-template-columns: 1fr; }
    body.mobilePreview .cultivationLayout { grid-template-columns: 1fr; }
    body.mobilePreview .lgiPanel { order: 1; }
    body.mobilePreview .mobileLiveAlerts { order: 2; }
    body.mobilePreview .imageColumn { order: 3; }
    body.mobilePreview .scoreRow { grid-template-columns: 82px 1fr; }
    body.mobilePreview .ring { width: 82px; }
    body.mobilePreview .ring b { font-size: 25px; }
    body.mobilePreview .ratioWrap { grid-template-columns: 48px minmax(0, 1fr); }
    body.mobilePreview .ratioPie { width: 48px; }
    body.mobilePreview .scene { height: auto; min-height: 0; aspect-ratio: 4 / 5; }
    body.mobilePreview .node { min-width: 96px; font-size: 12px; padding: 7px; }
    body.mobilePreview .node strong { font-size: 14px; }
    body.mobilePreview .n1 { right: 14px; top: 96px; }
    body.mobilePreview .n4 { left: 14px; bottom: 86px; }
    body.mobilePreview .n5 { left: 50%; bottom: 18px; }
    body.mobilePreview .visionSummary { grid-template-columns: 1fr; }
    @media (max-width: 1120px) {
      .top, .overview, .main, .bottomGrid, .cultivationLayout, .chartGrid, .trendSelectorGrid, .ruleGrid { grid-template-columns: 1fr; }
      .top > *, .panel, .card, .paramCard, .ratioToolbar { min-width: 0; }
      .paramGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .meta { justify-content: flex-start; }
      .ratioToolbar { flex-wrap: wrap; gap: 8px; }
      .scene { height: auto; min-height: 0; aspect-ratio: 4 / 5; }
    }
    @media (max-width: 640px) {
      .shell { padding: 12px; overflow-x: hidden; }
      .windowSwitch { flex-wrap: wrap; }
      .pill, .seg button, .toolButton, .tab, .mobileTab { padding-left: 10px; padding-right: 10px; }
      .light { font-size: 12px; padding-left: 8px; padding-right: 8px; }
      .title { font-size: 19px; }
      .indexCard .head, .paramCard .head { display: grid; grid-template-columns: 1fr; justify-items: start; }
      .brand { font-size: 22px; }
      .paramGrid { grid-template-columns: 1fr; }
      .scene { height: auto; min-height: 0; aspect-ratio: 4 / 5; }
    }
  </style>
</head>
<body class="splitConcept">
  <main class="shell">
    <header class="top">
      <div class="brand">JNC Bio-AIoT</div>
      <h1 class="title" id="title"></h1>
      <div class="meta">
        <button class="toolButton" id="langBtn" type="button"></button>
        <button class="toolButton" id="deviceBtn" type="button"></button>
        <span class="pill" id="zonePill"></span>
        <span class="pill" id="cropPill"></span>
        <span class="pill" id="dapPill"></span>
      </div>
    </header>

    <nav class="seg" aria-label="crop and page mode">
      <button class="settingsShortcut" id="settingsBtn" type="button"></button>
      <button class="active" type="button" data-crop="lettuce"></button>

        var lgiGreenDeg = lgiRatio[0] * 3.6;

        document.getElementById("lgiCard").innerHTML = '<div class="head"><div class="indexName"><strong>LGI</strong><span class="muted">' + txt("lgiSub") + '</span></div><span class="light ' + lgiLight + '"><i class="dot"></i>' + lightText(lgiScore) + '</span></div><div class="scoreRow"><div class="ring ' + ringClass(lgiScore) + '" style="--pct:' + lgiScore + '%"><b>' + lgiScore + '</b></div><div class="ratio"><div class="ratioWrap"><div class="ratioPie" style="--green-deg:' + lgiGreenDeg + 'deg; --yellow-deg:' + lgiYellowDeg + 'deg"></div><div class="ratioText"><span class="muted">' + (txt("ratio24h") || "24h") + '</span><span class="muted">' + txt("ratioLights") + ' ' + lgiRatio.join("/") + '%</span><span class="muted">' + txt("lgiOk") + '</span></div></div></div></div><div class="visionSummary">' + crop.visionKeys.map(function(key) {
          return '<span>' + txt(key) + '</span>';
        }).join("") + '</div><div class="growthFusionNote">' + txt("growthFusionNote").replace("{day}", crop.dap) + '</div>';
        var secondAlert = crop.alertType === "kale" ? txt("alertKale") : txt("alertTipburn");
        var secondAlertTitle = crop.alertType === "kale" ? txt("kaleAlertTitle") : txt("lettuceAlertTitle");
        document.getElementById("alertCount").textContent = txt("alertCountText");
        var alertsHtml =
          '<div class="item"><div class="itemHead"><strong>' + txt("rule1") + '</strong><span class="tier today">' + txt("tierToday") + '</span></div><span class="muted">' + txt(crop.leafTemp.dliAlertKey) + '</span></div>' +
          '<div class="item"><div class="itemHead"><strong>' + secondAlertTitle + '</strong><span class="tier observe">' + txt("tierObserve") + '</span></div><span class="muted">' + secondAlert + '</span></div>' +
          '<div class="deviceRow on"><strong>' + txt("fan") + '</strong><span class="pill">ON</span></div>' +
          '<div class="deviceRow"><strong>' + txt("fog") + '</strong><span class="pill">OFF</span></div>' +
          '<div class="deviceRow on"><strong>' + txt("led") + '</strong><span class="pill">PWM ' + (cropKey === "kale" ? "42%" : "58%") + '</span></div>';
        document.getElementById("alerts").innerHTML = alertsHtml;
        document.getElementById("mobileLiveAlerts").innerHTML = '<div class="mobileAlertTitle"><strong>' + txt("alertTitle") + '</strong><span class="light yellow"><i class="dot"></i>' + txt("alertCountText") + '</span></div>' + alertsHtml;
        document.getElementById("rules").innerHTML =
          '<div class="ruleCard warn"><span class="ruleBadge">01</span><div><strong>' + txt("rule1") + '</strong><span class="muted">' + txt(crop.leafTemp.ruleTextKey) + '</span></div></div>' +
          '<div class="ruleCard"><span class="ruleBadge">02</span><div><strong>' + txt("rule2") + '</strong><span class="muted">' + txt("rule2Text") + '</span></div></div>' +
          '<div class="ruleCard"><span class="ruleBadge">03</span><div><strong>' + txt("rule3") + '</strong><span class="muted">' + txt("rule3Text") + '</span></div></div>';
        document.getElementById("liveView").classList.toggle("hidden", view !== "live");
        document.getElementById("trendView").classList.toggle("hidden", view !== "trend");
        drawAll();
      }

      function renderLiveReadings(crop) {
        return renderLeafTempCard(crop) + crop.params.slice(0, 4).map(function(p) {
          var l = light(p[3]);
          return '<article class="paramCard"><div class="head"><h3>' + p[0] + '</h3><span class="light ' + l + '"><i class="dot"></i>' + lightText(p[3]) + '</span></div><div class="paramValue">' + p[1] + ' <span class="muted">' + p[2] + '</span></div></article>';
        }).join("") + '<article class="paramCard"><div class="head"><h3>CO2</h3><span class="light green"><i class="dot"></i>' + txt("statusIdeal") + '</span></div><div class="paramValue">' + crop.scene.co2 + '</div></article><article class="paramCard"><div class="head"><h3>' + txt("waterNode") + '</h3></div><div class="paramValue">' + crop.scene.water + '</div></article>';
      }

      function renderLeafTempCard(crop) {
        var lt = crop.leafTemp;
        var l = light(lt.score);
        var ratio = lt.ratios[ratioWindow];
        var greenDeg = ratio[0] * 3.6;
        var yellowDeg = (ratio[0] + ratio[1]) * 3.6;
        var rows = lt.records.map(function(r) {
          var rl = light(r.score);
          var thermal = r.thermal ? '<span class="muted">' + txt("thermalImage") + '</span>' : '<span class="muted">--</span>';
          return '<div class="measureRow"><span>' + r.slot + '</span><strong>' + r.value + lt.unit + '</strong><span class="miniDot ' + (rl === "green" ? "" : rl) + '"></span>' + thermal + '</div>';
        }).join("");
        return '<article class="paramCard leafTempCard"><div class="leafTempTop"><div><div class="head"><h3>' + txt("leafTempLabel") + '</h3><span class="light ' + l + '"><i class="dot"></i>' + lightText(lt.score) + '</span></div><div class="paramValue">' + lt.value + ' <span class="muted">' + lt.unit + '</span></div><div class="leafMeta"><span>' + txt("measuredAt").replace("{time}", lt.measuredAt) + '</span><span>' + txt("validUntil") + ' ' + lt.validUntil + '</span></div></div><div class="thermalThumb" title="' + txt("thermalImage") + '"></div></div><div class="measureRows">' + rows + '</div><div class="leafTempRatio"><div class="ratioPie" style="--green-deg:' + greenDeg + 'deg; --yellow-deg:' + yellowDeg + 'deg"></div><div class="ratioText"><span class="muted">' + ratioWindowText(ratioWindow) + ' ' + txt("countRatio") + '</span><span class="muted">' + txt("ratioLights") + ' ' + ratio.join("/") + '%</span></div></div></article>';
      }

      function renderLeafTempTrend() {
        var crop = crops[cropKey];
        var lt = crop.leafTemp;
        var ratio = lt.ratios[ratioWindow];
        var greenDeg = ratio[0] * 3.6;
        var yellowDeg = (ratio[0] + ratio[1]) * 3.6;
        var records = lt.records.map(function(r) {
          var rl = light(r.score);
          return '<div class="measureRow"><span>' + r.slot + '</span><strong>' + r.value + lt.unit + '</strong><span class="light ' + rl + '"><i class="dot"></i>' + lightText(r.score) + '</span></div>';
        }).join("");
        var history = lt.history.map(function(v, i) {
          return '<div class="dayDot">D-' + (6 - i) + '<br>' + v + '</div>';
        }).join("");
        document.getElementById("leafTempTrend").innerHTML = '<div class="head"><div><h3>' + txt("leafTempLabel") + '</h3><span class="muted">' + txt("noCurve") + '</span></div><span class="light ' + light(lt.score) + '"><i class="dot"></i>' + lightText(lt.score) + '</span></div><div class="recordGrid">' + records + '</div><div class="leafTempRatio"><div class="ratioPie" style="--green-deg:' + greenDeg + 'deg; --yellow-deg:' + yellowDeg + 'deg"></div><div class="ratioText"><span class="muted">' + ratioWindowText(ratioWindow) + ' ' + txt("countRatio") + '</span><span class="muted">' + txt("ratioLights") + ' ' + ratio.join("/") + '%</span><span class="muted">' + txt("latestMeasurement") + ' ' + lt.value + lt.unit + ' / ' + txt("validUntil") + ' ' + lt.validUntil + '</span></div></div><strong>' + txt("sevenDayRecords") + '</strong><div class="dotHistory">' + history + '</div>';
      }

      function drawChart(canvas, title, unit, ideal, real, forecast) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        var w = rect.width, h = rect.height;
        var m = { l: 42, r: 18, t: 28, b: 30 };
        var pw = w - m.l - m.r, ph = h - m.t - m.b;
        var all = ideal.concat(real).concat(forecast);
        var min = Math.min.apply(null, all) - 2;
        var max = Math.max.apply(null, all) + 2;
        if (unit === "mS/cm") { min = 0.8; max = 2.2; }
        if (unit === "score") { min = 50; max = 100; }
        ctx.fillStyle = "#071827"; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(53,230,125,.09)"; ctx.fillRect(m.l, m.t, pw, ph * .32);
        ctx.fillStyle = "rgba(255,209,102,.08)"; ctx.fillRect(m.l, m.t + ph * .32, pw, ph * .26);
        ctx.fillStyle = "rgba(255,91,122,.08)"; ctx.fillRect(m.l, m.t + ph * .58, pw, ph * .42);
        ctx.strokeStyle = "#1d3d54";
        [0,.25,.5,.75,1].forEach(function(p){ ctx.beginPath(); ctx.moveTo(m.l, m.t + ph * p); ctx.lineTo(m.l + pw, m.t + ph * p); ctx.stroke(); });
        function y(v) { return m.t + ph * (1 - (v - min) / (max - min)); }
        function line(arr, color, dash, offset) {
          ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.setLineDash(dash || []); ctx.beginPath();
          arr.forEach(function(v, i){ var x = m.l + pw * (i + (offset || 0)) / 7; if (i === 0) ctx.moveTo(x, y(v)); else ctx.lineTo(x, y(v)); });
          ctx.stroke(); ctx.restore();
        }
        line(ideal, "#55dcff", [7, 6], 0);
        line(real, "#35e67d", [], 0);
        line(forecast, "#ffd166", [3, 5], 4);
        ctx.fillStyle = "#edfaff"; ctx.font = "14px Microsoft JhengHei, Arial"; ctx.fillText(title, 14, 19);
        ctx.font = "12px Microsoft JhengHei, Arial";
        ctx.fillStyle = "#55dcff"; ctx.fillText(txt("ideal"), w - 142, 19);
        ctx.fillStyle = "#35e67d"; ctx.fillText(txt("realtime"), w - 96, 19);
        ctx.fillStyle = "#ffd166"; ctx.fillText(txt("forecast"), w - 48, 19);
      }
      function drawAll() {
        var crop = crops[cropKey];
        var leafSelected = selectedParamTrend === "leafTemp";
        var leafTrend = document.getElementById("leafTempTrend");
        leafTrend.classList.toggle("hidden", !leafSelected);
        if (leafSelected) {
          renderLeafTempTrend();
        }
        document.querySelectorAll("[data-chart]").forEach(function(canvas) {
          if (canvas.dataset.chart === "param") {
            canvas.classList.toggle("hidden", leafSelected);
            if (!leafSelected) {
              var paramSeries = paramTrendSeries(cropKey, selectedParamTrend);
              drawChart(canvas, paramSeries.label + " " + txt("ideal") + " / " + txt("realtime") + " / " + txt("forecast"), paramSeries.unit, paramSeries.ideal, paramSeries.real, paramSeries.pred);
            }
          } else {
            var series = indexTrendSeries(cropKey, selectedIndexTrend);
            drawChart(canvas, selectedIndexTrend + " " + txt("ideal") + " / " + txt("realtime") + " / " + txt("forecast"), "score", series.ideal, series.real, series.pred);
          }
        });
      }
      function paramTrendSeries(crop, code) {
        var data = {
          lettuce: {
            EC: { label: "EC", unit: "mS/cm", ideal: [1.4,1.4,1.45,1.5,1.5], real: [1.32,1.38,1.45,1.48,1.45], pred: [1.47,1.5,1.54] },
            pH: { label: "pH", unit: "", ideal: [5.8,5.8,5.9,6.0,6.0], real: [5.76,5.84,5.92,5.96,5.92], pred: [5.94,5.96,5.98] },
            DO: { label: "DO", unit: "mg/L", ideal: [6.8,6.8,7.0,7.0,7.0], real: [6.4,6.6,6.8,6.9,6.8], pred: [6.85,6.92,7.0] },
            VPD: { label: "VPD", unit: "kPa", ideal: [1.1,1.15,1.2,1.2,1.2], real: [1.18,1.25,1.34,1.36,1.34], pred: [1.32,1.3,1.28] },
            DLI: { label: "DLI", unit: "mol", ideal: [12,12,12,12,12], real: [7.2,8.1,9.0,9.8,9.8], pred: [10.4,11.2,12.0] }
          },
          kale: {
            EC: { label: "EC", unit: "mS/cm", ideal: [1.7,1.75,1.8,1.8,1.82], real: [1.62,1.68,1.72,1.75,1.72], pred: [1.74,1.76,1.78] },
            pH: { label: "pH", unit: "", ideal: [5.8,5.8,5.9,6.0,6.0], real: [5.82,5.84,5.86,5.88,5.86], pred: [5.88,5.9,5.92] },
            DO: { label: "DO", unit: "mg/L", ideal: [6.8,6.8,7.0,7.0,7.0], real: [6.1,6.3,6.5,6.6,6.5], pred: [6.55,6.65,6.75] },
            VPD: { label: "VPD", unit: "kPa", ideal: [1.0,1.05,1.1,1.1,1.1], real: [0.68,0.7,0.74,0.76,0.74], pred: [0.76,0.8,0.84] },
            DLI: { label: "DLI", unit: "mol", ideal: [13,13,13,13,13], real: [10.2,11.4,12.5,13.4,13.4], pred: [13.2,13.0,12.8] }
          }
        };
        return (data[crop] && data[crop][code]) || data.lettuce.EC;
      }
      function indexTrendSeries(crop, code) {
        var data = {
          lettuce: {
            RHI: { ideal: [90,90,90,90,90], real: [82,84,86,87,87], pred: [88,86,84] },
            PMI: { ideal: [88,88,88,88,88], real: [76,74,72,72,73], pred: [74,75,77] },
            "DLI-CR": { ideal: [85,85,85,85,85], real: [62,65,67,68,68], pred: [70,73,76] },
            LGI: { ideal: [86,86,86,86,86], real: [78,80,82,84,84], pred: [85,86,87] }
          },
          kale: {
            RHI: { ideal: [90,90,90,90,90], real: [82,84,87,89,89], pred: [88,87,86] },
            PMI: { ideal: [88,88,88,88,88], real: [72,75,78,79,79], pred: [80,81,82] },
            "DLI-CR": { ideal: [85,85,85,85,85], real: [78,81,84,86,86], pred: [86,86,87] },
            LGI: { ideal: [86,86,86,86,86], real: [70,73,75,76,76], pred: [78,80,82] }
          }
        };
        return (data[crop] && data[crop][code]) || data.lettuce.RHI;
      }
      function setMobilePanel(panel) {
        mobilePanel = panel;
        document.body.dataset.mobilePanel = panel;
        document.querySelectorAll("[data-mobile-panel]").forEach(function(el) {
          el.classList.toggle("mobileActive", (el.dataset.mobilePanel || "").split(/\s+/).indexOf(panel) >= 0);
        });
        document.querySelectorAll("[data-mobile-tab]").forEach(function(btn) {
          btn.classList.toggle("active", btn.dataset.mobileTab === panel);
        });
        setTimeout(drawAll, 0);
      }
      document.querySelectorAll("[data-crop]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          cropKey = btn.dataset.crop;
          document.querySelectorAll("[data-crop]").forEach(function(b){ b.classList.toggle("active", b === btn); });
          render();
        });
      });
      document.querySelectorAll("[data-view]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          view = btn.dataset.view;
          document.querySelectorAll("[data-view]").forEach(function(b){ b.classList.toggle("active", b === btn); });
          render();
        });
      });
      document.querySelectorAll("[data-ratio-window]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          ratioWindow = btn.dataset.ratioWindow;
          render();
        });
      });
      document.getElementById("langBtn").addEventListener("click", function() {
        lang = lang === "zh" ? "en" : "zh";
        render();
      });
      document.getElementById("deviceBtn").addEventListener("click", function() {
        var enabled = document.body.classList.toggle("mobilePreview");
        this.classList.toggle("active", enabled);
        setMobilePanel(mobilePanel);
        render();
      });
      document.getElementById("paramTrendSelect").addEventListener("change", function() {
        selectedParamTrend = this.value || "EC";
        drawAll();
      });
      document.getElementById("indexTrendSelect").addEventListener("change", function() {
        selectedIndexTrend = this.value || "RHI";
        drawAll();
      });
      document.getElementById("settingsBtn").addEventListener("click", function() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "AIOT_NAVIGATE", page: "settings" }, "*");
          try { window.parent.location.hash = "page=settings"; } catch (error) {}
        } else {
          window.location.href = "../../desktop/#page=settings";
        }
      });
      document.querySelectorAll("[data-mobile-tab]").forEach(function(btn) {
        btn.addEventListener("click", function(){ setMobilePanel(btn.dataset.mobileTab); });
      });
      window.addEventListener("resize", drawAll);
      render();
      setMobilePanel(mobilePanel);
    })();
  </script>
